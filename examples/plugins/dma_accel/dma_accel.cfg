# Platform configuration for demo DMA accelerator plugin

[soc]
name = "dma_demo_soc"
device_policy = "allow-unlisted"

[memory]
dram_base = 0x80000000
dram_size = 0x10000000

[plugins]
dma = "./build/libdemo-dma-accel.so"

[device.custom-mmio.dma]
name = "dma_accel"
compatible = "simrv,demo-dma-accel"
base = 0x10060000
size = 0x1000
irq = 17
