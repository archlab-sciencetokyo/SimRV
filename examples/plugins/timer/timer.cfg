# Platform configuration for demo timer device plugin

[soc]
name = "timer_demo_soc"
device_policy = "allow-unlisted"

[memory]
dram_base = 0x80000000
dram_size = 0x10000000

[plugins]
timer = "./build/libdemo-timer.so"

[device.custom-mmio.timer]
name = "timer"
compatible = "simrv,demo-timer"
base = 0x10050000
size = 0x1000
irq = 16
