name: RISC-V behavior mismatch
description: Report a result that may not match the RISC-V specification
title: "[correctness]: "
labels: ["correctness"]
body:
  - type: textarea
    attributes:
      label: What happened, and what did you expect?
      description: If you can, name the RISC-V rule or section that seems relevant.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Example that shows the problem
      description: Share a small program or input, the command you ran, and the result. Include a trace if you have one.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Setup details
      description: SimRV version, host/compiler, RV32 or RV64, enabled extensions, vector length, privilege mode, or report. Include what you know.
    validations: {required: false}
