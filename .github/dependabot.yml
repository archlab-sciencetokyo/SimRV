version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /.github
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docs)"
