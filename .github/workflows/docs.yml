name: Documentation

on:
  push:
    branches: [main, dev, 'release/**']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  # Each deployment contains both maintained branches; serialize Pages writes.
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --group docs --frozen

      - name: Build documentation site with Zensical
        env:
          SIMRV_DOCS_CHANNEL: development
        run: uv run --frozen zensical build --strict

      - name: Verify MkDocs compatibility build
        env:
          SIMRV_DOCS_CHANNEL: development
          SIMRV_DOCS_SITE_DIR: site-mkdocs
        run: uv run --frozen mkdocs build --strict

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/site" --exclude 'file:///.*\/site\/SimRV(/|$)' "site/**/*.html"
          fail: true

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable documentation
        uses: actions/checkout@v4
        with:
          ref: main
          path: docs-main

      - name: Checkout development documentation
        uses: actions/checkout@v4
        with:
          ref: dev
          path: docs-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install documentation dependencies
        working-directory: docs-dev
        run: uv sync --group docs --frozen

      - name: Build stable and development sites with Zensical
        run: |
          mkdir -p site
          SIMRV_DOCS_SITE_URL="https://archlab-sciencetokyo.github.io/SimRV/stable/" \
            SIMRV_DOCS_SITE_DIR="$GITHUB_WORKSPACE/docs-main/site" \
            SIMRV_DOCS_EDIT_URI="edit/main/docs/" \
            SIMRV_DOCS_CHANNEL="stable" \
            docs-dev/.venv/bin/zensical build --strict --config-file docs-main/mkdocs.yml
          SIMRV_DOCS_SITE_URL="https://archlab-sciencetokyo.github.io/SimRV/dev/" \
            SIMRV_DOCS_SITE_DIR="$GITHUB_WORKSPACE/docs-dev/site" \
            SIMRV_DOCS_EDIT_URI="edit/dev/docs/" \
            SIMRV_DOCS_CHANNEL="development" \
            docs-dev/.venv/bin/zensical build --strict --config-file docs-dev/mkdocs.yml
          cp -a docs-main/site site/stable
          cp -a docs-dev/site site/dev
          cp -a site/stable site/latest
          printf '%s\n' \
            '[' \
            '  {"version":"stable","title":"Stable","aliases":["latest"]},' \
            '  {"version":"dev","title":"Development","aliases":[]}' \
            ']' > site/versions.json
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=stable/">' \
            '<link rel="canonical" href="stable/">' > site/index.html

      - name: Check generated documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/site" --exclude 'file:///.*\/site\/SimRV(/|$)' "site/**/*.html"
          fail: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
