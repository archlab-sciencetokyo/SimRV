name: Documentation

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'zensical.yml'
      - '.github/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'zensical.yml'
      - '.github/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each deployment contains both maintained branches; serialize Pages writes.
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement .github/requirements-docs.txt

      - name: Build documentation site with Zensical
        env:
          SIMRV_DOCS_CHANNEL: development
        run: zensical build --strict --config-file zensical.yml

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/site" --exclude 'file:///.*\/site\/SimRV(/|$)' "site/**/*.html"
          fail: true

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: docs-main

      - name: Checkout development documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: docs-dev

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-dev/.github/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs-dev/.github/requirements-docs.txt

      - name: Build stable and development sites with Zensical
        run: |
          mkdir -p site
          # The stable branch still stores its Zensical-compatible config as mkdocs.yml.
          SIMRV_DOCS_SITE_URL="https://archlab-sciencetokyo.github.io/SimRV/stable/" \
            SIMRV_DOCS_SITE_DIR="$GITHUB_WORKSPACE/docs-main/site" \
            SIMRV_DOCS_EDIT_URI="edit/main/docs/" \
            SIMRV_DOCS_CHANNEL="stable" \
            zensical build --strict --config-file docs-main/mkdocs.yml
          SIMRV_DOCS_SITE_URL="https://archlab-sciencetokyo.github.io/SimRV/dev/" \
            SIMRV_DOCS_SITE_DIR="$GITHUB_WORKSPACE/docs-dev/site" \
            SIMRV_DOCS_EDIT_URI="edit/dev/docs/" \
            SIMRV_DOCS_CHANNEL="development" \
            zensical build --strict --config-file docs-dev/zensical.yml
          cp -a docs-main/site site/stable
          cp -a docs-dev/site site/dev
          cp -a site/stable site/latest
          printf '%s\n' \
            '[' \
            '  {"version":"stable","title":"Stable","aliases":["latest"]},' \
            '  {"version":"dev","title":"Development","aliases":[]}' \
            ']' > site/versions.json
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=stable/">' \
            '<link rel="canonical" href="stable/">' > site/index.html

      - name: Check generated documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/site" --exclude 'file:///.*\/site\/SimRV(/|$)' "site/**/*.html"
          fail: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
