name: Release Binaries

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'zensical.yml'
      - 'mkdocs.yml'
      - '.github/requirements-docs.txt'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RISCV_TESTS_REVISION: 933a897d8631773f385d45938facc466dddc7514

jobs:
  guest-architecture-check:
    name: Guest architecture (${{ matrix.arch }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: fedora:44

    strategy:
      fail-fast: false
      matrix:
        arch: [rv32, rv64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          dnf update -y
          dnf install -y git cmake ninja-build boost-devel libslirp-devel gcc gcc-c++ clang-tools-extra wget tar xz autoconf make which

      - name: Fetch and compile riscv-tests
        run: |
          # Download and extract prebuilt xPack RISC-V GCC toolchain
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
          mkdir -p /opt/riscv
          tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt/riscv --strip-components=1
          
          # Add toolchain bin directory to GITHUB_PATH for subsequent steps
          echo "/opt/riscv/bin" >> $GITHUB_PATH
          
          # Expose in current execution path
          export PATH="/opt/riscv/bin:$PATH"

          # Clone and build riscv-tests
          git clone https://github.com/riscv-software-src/riscv-tests.git "$RUNNER_TEMP/riscv-tests"
          cd "$RUNNER_TEMP/riscv-tests"
          git checkout --detach "$RISCV_TESTS_REVISION"
          git submodule update --init --recursive
          autoconf
          ./configure
          ARCH="${{ matrix.arch }}"
          make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN="${ARCH#rv}"
          if [[ "${ARCH}" == "rv64" ]]; then
            make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN=32
          fi

      - name: Configure
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: >-
          cmake --preset ${{ matrix.arch }}-release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DSIMRV_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.arch }}-release

      - name: Run CTest gate suite
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate

      - name: Run GA smoke workflow
        run: build/${{ matrix.arch }}-release/simrv-smoke --simrv build/${{ matrix.arch }}-release/simrv

      - name: Validate source release metadata
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L release

      - name: Compute asset names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ -z "${SIMRV_VERSION}" ]]; then
            echo "Failed to parse SIMRV_VERSION from CMakeLists.txt" >&2
            exit 1
          fi

          VERSION_TAG="v${SIMRV_VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && "${GITHUB_REF_NAME}" != "${VERSION_TAG}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match CMake version tag ${VERSION_TAG}" >&2
            exit 1
          fi

          ASSET_BASE="SimRV-linux-x86_64-${VERSION_TAG}"
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_base=${ASSET_BASE}" >> "$GITHUB_OUTPUT"

  rpm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      # Rocky Linux 9 keeps the glibc baseline at 2.34 while GCC Toolset 15 supplies
      # the C++23 library needed by SimRV. The executable statically links the
      # toolset C++ runtime so users do not need GCC Toolset installed. Rocky's
      # CRB repository provides libslirp-devel, which UBI does not publish.
      image: rockylinux:9
    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y gcc-toolset-15-gcc gcc-toolset-15-gcc-c++ \
            gcc-toolset-15-libstdc++-devel gcc gcc-c++ \
            libslirp-devel git make python3-pip rpm-build rpmlint findutils binutils \
            bzip2-devel pkgconf-pkg-config tar wget which
          python3 -m pip install cmake==4.3.0 ninja || \
            python3 -m pip install --break-system-packages cmake==4.3.0 ninja
          wget -q https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.bz2 \
            -O /tmp/boost_1_83_0.tar.bz2
          echo '6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e  /tmp/boost_1_83_0.tar.bz2' \
            | sha256sum --check
          tar -xjf /tmp/boost_1_83_0.tar.bz2 -C /tmp
          cd /tmp/boost_1_83_0
          ./bootstrap.sh
          ./b2 --with-headers install --prefix=/opt/boost-1.83
          echo "/opt/boost-1.83/lib/cmake/Boost-1.83.0" >> "$GITHUB_PATH"
          echo "Boost_DIR=/opt/boost-1.83/lib/cmake/Boost-1.83.0" >> "$GITHUB_ENV"
          echo "/opt/rh/gcc-toolset-15/root/usr/bin" >> "$GITHUB_PATH"
          echo "CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc" >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Validate release tag
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            test "${GITHUB_REF_NAME}" = "v${SIMRV_VERSION}"
          fi
          test "${SIMRV_VERSION%%.*}" -ge 3
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_base=SimRV-linux-x86_64-v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Configure and build RHEL 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset rv64-release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DSIMRV_ALLOW_UNQUALIFIED_TOOLCHAIN=ON \
            -DSIMRV_X86_64_V3_BASELINE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build --preset rv64-release --parallel 2
          ! readelf -d build/rv64-release/simrv | grep -Eq 'libstdc\+\+|libgcc_s'
          max_glibc="$(readelf --version-info build/rv64-release/simrv \
            | sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p' | sort -V | tail -n 1)"
          test -n "$max_glibc"
          test "$(printf '%s\n' "$max_glibc" 2.34 | sort -V | tail -n 1)" = 2.34
          ctest --test-dir build/rv64-release --output-on-failure -R package-install-consumer
      - name: Build and validate RPM packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cpack --config build/rv64-release/CPackConfig.cmake -G RPM -B packages
          mapfile -t rpms < <(find packages -maxdepth 1 -name '*.rpm' -type f | sort)
          test "${#rpms[@]}" -eq 4
          for package in "${rpms[@]}"; do rpm -qpl "$package" >/dev/null; done
          runtime_rpm="$(find packages -maxdepth 1 -name 'simrv-[0-9]*.rpm' -type f)"
          development_rpm="$(find packages -maxdepth 1 -name 'simrv-devel-[0-9]*.rpm' -type f)"
          rpm -qpl "$runtime_rpm" > packages/runtime-rpm-contents.txt
          rpm -qpl "$development_rpm" > packages/development-rpm-contents.txt
          grep -q '/usr/bin/simrv$' packages/runtime-rpm-contents.txt
          grep -q '/include/simrv/core/MachineConfig.hpp$' packages/development-rpm-contents.txt
          grep -q '/libsimrv-runtime.a$' packages/development-rpm-contents.txt
          grep -q '/cmake/SimRV/SimRVConfig.cmake$' packages/development-rpm-contents.txt
          if rpm -qp --requires "$runtime_rpm" | grep -Eq 'libstdc\+\+|libgcc_s|GLIBCXX'; then
            echo "Runtime RPM unexpectedly requires the GCC Toolset C++ runtime" >&2
            exit 1
          fi
          rpm -qp --requires "$development_rpm" | grep -Fx \
            "simrv = $(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$runtime_rpm")"
          rpmlint --rpmlintrc packaging/simrv.rpmlintrc packages/*.rpm
          dnf install -y packages/*.rpm
          simrv --version | grep -F "${{ steps.names.outputs.simrv_version }}"
          cmake -S tests/package-consumer -B packages/consumer-build
          cmake --build packages/consumer-build
          packages/consumer-build/simrv-package-consumer
          dnf remove -y simrv-devel
          rpm -q simrv >/dev/null
          if rpm -q simrv-devel >/dev/null 2>&1; then
            echo "simrv-devel remained installed after removal" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}-rpm
          path: packages/*.rpm
          retention-days: 14

  portable-musl:
    name: Portable Linux archive (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            test "${GITHUB_REF_NAME}" = "v${SIMRV_VERSION}"
          fi
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_base=SimRV-linux-${{ matrix.arch }}-v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build static musl archive inside Alpine
        shell: bash
        env:
          SIMRV_ASSET_BASE: ${{ steps.names.outputs.asset_base }}
          SIMRV_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SIMRV_HOST_UID="$(id -u)"
          SIMRV_HOST_GID="$(id -g)"
          docker run --rm \
            -e SIMRV_ASSET_BASE -e SIMRV_ARCH -e SIMRV_HOST_UID -e SIMRV_HOST_GID \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            alpine:edge sh .github/scripts/portable-musl-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}
          path: ${{ steps.names.outputs.asset_base }}.tar.gz
          retention-days: 14

  debian-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      # Build against Noble's glibc baseline. GCC 15 provides std::flat_map and
      # std::flat_set; static C++ runtime linkage keeps the package runnable on
      # stock Noble without requiring the toolchain PPA at runtime.
      image: ubuntu:24.04
    steps:
      - name: Install package build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git software-properties-common \
            libboost1.83-dev libglib2.0-dev libslirp-dev make binutils pkg-config \
            python3 python3-pip dpkg-dev xz-utils lintian
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends gcc-15 g++-15
          python3 -m pip install cmake==4.3.0 ninja || \
            python3 -m pip install --break-system-packages cmake==4.3.0 ninja
          echo "CC=gcc-15" >> "$GITHUB_ENV"
          echo "CXX=g++-15" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Validate release tag
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            test "${GITHUB_REF_NAME}" = "v${SIMRV_VERSION}"
          fi
          test "${SIMRV_VERSION%%.*}" -ge 3
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_base=SimRV-linux-x86_64-v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Configure and build
        run: |
          cmake --preset rv64-release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DSIMRV_ALLOW_UNQUALIFIED_TOOLCHAIN=ON \
            -DSIMRV_X86_64_V3_BASELINE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build --preset rv64-release --parallel 2
          max_glibc="$(readelf --version-info build/rv64-release/simrv \
            | sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p' | sort -V | tail -n 1)"
          test -n "$max_glibc"
          test "$(printf '%s\n' "$max_glibc" 2.39 | sort -V | tail -n 1)" = 2.39
          ! readelf -d build/rv64-release/simrv | grep -Eq 'libstdc\+\+|libgcc_s'
          if readelf --version-info build/rv64-release/simrv | grep -q 'Name: GLIBCXX_'; then
            echo "Ubuntu DEB runtime unexpectedly depends on a dynamic libstdc++ symbol" >&2
            exit 1
          fi
      - name: Validate install tree
        run: ctest --test-dir build/rv64-release --output-on-failure -R package-install-consumer
      - name: Build and validate DEB packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cpack --config build/rv64-release/CPackConfig.cmake \
            -D CPACK_DEBIAN_RUNTIME_PACKAGE_DEPENDS=libc6 -G DEB -B packages
          mapfile -t debs < <(find packages -maxdepth 1 -name '*.deb' -type f | sort)
          test "${#debs[@]}" -eq 4
          for package in "${debs[@]}"; do dpkg-deb --contents "$package" >/dev/null; done
          runtime_deb="$(find packages -maxdepth 1 -name 'simrv_[0-9]*.deb' -type f)"
          development_deb="$(find packages -maxdepth 1 -name 'simrv-devel_[0-9]*.deb' -type f)"
          dpkg-deb --contents "$runtime_deb" > packages/runtime-deb-contents.txt
          dpkg-deb --contents "$development_deb" > packages/development-deb-contents.txt
          grep -q '/usr/bin/simrv$' packages/runtime-deb-contents.txt
          grep -q '/include/simrv/core/MachineConfig.hpp$' packages/development-deb-contents.txt
          grep -q '/libsimrv-runtime.a$' packages/development-deb-contents.txt
          grep -q '/cmake/SimRV/SimRVConfig.cmake$' packages/development-deb-contents.txt
          if grep -Eq '/include/simrv/|/libsimrv-runtime\.a$|/cmake/SimRV/' packages/runtime-deb-contents.txt; then
            echo "Runtime DEB unexpectedly contains SDK files" >&2
            exit 1
          fi
          dpkg-deb --field "$runtime_deb" Depends > packages/runtime-deb-depends.txt
          grep -q 'libc6' packages/runtime-deb-depends.txt
          if grep -Eq 'libgcc-s1|libstdc\+\+6' packages/runtime-deb-depends.txt; then
            echo "Runtime DEB unexpectedly depends on the C++ compiler runtime" >&2
            exit 1
          fi
          runtime_version="$(dpkg-deb --field "$runtime_deb" Version)"
          dpkg-deb --field "$development_deb" Depends | grep -F "simrv (= ${runtime_version})"
          if grep -q 'simrv-benchmark' packages/runtime-deb-contents.txt; then
            echo "Runtime DEB unexpectedly contains benchmark tooling" >&2
            exit 1
          fi
          lintian --fail-on error \
            --suppress-tags malformed-contact,too-many-contacts,no-changelog,no-copyright-file,uncompressed-manual-page,unstripped-binary-or-object,hardening-no-pie,binary-from-other-architecture,statically-linked-binary \
            packages/*.deb
          apt-get install -y ./packages/*.deb
          simrv --version | grep -F "${{ steps.names.outputs.simrv_version }}"
          cmake -S tests/package-consumer -B packages/consumer-build
          cmake --build packages/consumer-build
          packages/consumer-build/simrv-package-consumer
          apt-get remove -y simrv-devel
          dpkg-query -W -f='${Status}' simrv | grep -Fx 'install ok installed'
          development_status="$(dpkg-query -W -f='${Status}' simrv-devel 2>/dev/null || true)"
          if [[ "${development_status}" == 'install ok installed' ]]; then
            echo "simrv-devel remained installed after removal" >&2
            exit 1
          fi
          test ! -e /usr/include/simrv/core/MachineConfig.hpp
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}-deb
          path: packages/*.deb
          retention-days: 14

  package-distro-matrix:
    needs: [rpm-packages, debian-packages, portable-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            family: rpm
          - image: rockylinux:9
            family: rpm
          - image: ubuntu:24.04
            family: deb
          - image: debian:sid
            family: deb
          - image: fedora:40
            family: tgz
          - image: ubuntu:22.04
            family: tgz
          - image: ubuntu:24.04
            family: tgz
          - image: debian:12
            family: tgz
          - image: debian:13
            family: tgz
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: SimRV-linux-x86_64-v*
          path: staging
          merge-multiple: true
      - name: Install runtime package
        shell: bash
        run: |
          set -euo pipefail
          simrv_command=simrv
          if [[ "${{ matrix.family }}" == tgz ]]; then
            archive="$(find staging -name 'SimRV-linux-x86_64-v*.tar.gz' -type f | head -n 1)"
            test -n "${archive}"
            mkdir extracted
            tar -xzf "${archive}" -C extracted
            test -x extracted/usr/bin/simrv
            simrv_command=extracted/usr/bin/simrv
          elif [[ "${{ matrix.family }}" == rpm ]]; then
            dnf install -y findutils
            runtime="$(find staging -name 'simrv-[0-9]*.rpm' -type f | head -n 1)"
            test -n "${runtime}"
            dnf install -y "${runtime}"
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            runtime="$(find staging -name 'simrv_[0-9]*_amd64.deb' -type f | head -n 1)"
            test -n "${runtime}"
            apt-get install -y "./${runtime}"
          fi
          "${simrv_command}" --version
          if [[ "${{ matrix.family }}" != tgz ]]; then
            command -v simrv
          fi

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [guest-architecture-check, rpm-packages, debian-packages, portable-musl, package-distro-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install native repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends createrepo-c dpkg-dev
      - uses: actions/download-artifact@v8
        with:
          pattern: SimRV-linux-*-v*
          path: staging
          merge-multiple: true
      - name: Bundle native packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          mkdir -p dist rpm-packages deb-packages
          find staging -type f -name '*.rpm' -exec cp {} rpm-packages/ \;
          find staging -type f -name '*.deb' -exec cp {} deb-packages/ \;
          test "$(find rpm-packages -type f -name '*.rpm' | wc -l)" -eq 4
          test "$(find deb-packages -type f -name '*.deb' | wc -l)" -eq 4
          createrepo_c rpm-packages
          test -f rpm-packages/repodata/repomd.xml
          grep -q 'type="primary"' rpm-packages/repodata/repomd.xml
          (cd deb-packages && dpkg-scanpackages . /dev/null > Packages)
          test "$(grep -c '^Package: ' deb-packages/Packages)" -eq 4
          grep -q '^Package: simrv-devel$' deb-packages/Packages
          grep -q '^Filename: \./simrv' deb-packages/Packages
          grep -q '^Depends: simrv ' deb-packages/Packages
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C rpm-packages -czf "dist/SimRV-rpm-packages-v${VERSION}.tar.gz" .
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C deb-packages -czf "dist/SimRV-deb-packages-v${VERSION}.tar.gz" .
          cp staging/SimRV-linux-x86_64-v${VERSION}.tar.gz dist/
          cp staging/SimRV-linux-aarch64-v${VERSION}.tar.gz dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
      - uses: actions/upload-artifact@v7
        with:
          name: SimRV-release-assets
          path: dist/*.tar.gz
          retention-days: 14
      - name: Upload curated release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
