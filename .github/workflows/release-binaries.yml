name: Release Binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RISCV_TESTS_REVISION: 933a897d8631773f385d45938facc466dddc7514

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    container:
      image: fedora:44

    strategy:
      fail-fast: false
      matrix:
        arch: [rv32, rv64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          dnf update -y
          dnf install -y git cmake ninja-build gcc gcc-c++ clang-tools-extra wget tar xz autoconf make which rpm-build

      - name: Fetch and compile riscv-tests
        run: |
          # Download and extract prebuilt xPack RISC-V GCC toolchain
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
          mkdir -p /opt/riscv
          tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt/riscv --strip-components=1
          
          # Add toolchain bin directory to GITHUB_PATH for subsequent steps
          echo "/opt/riscv/bin" >> $GITHUB_PATH
          
          # Expose in current execution path
          export PATH="/opt/riscv/bin:$PATH"

          # Clone and build riscv-tests
          git clone https://github.com/riscv-software-src/riscv-tests.git "$RUNNER_TEMP/riscv-tests"
          cd "$RUNNER_TEMP/riscv-tests"
          git checkout --detach "$RISCV_TESTS_REVISION"
          git submodule update --init --recursive
          autoconf
          ./configure
          ARCH="${{ matrix.arch }}"
          make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN="${ARCH#rv}"

      - name: Configure
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: >-
          cmake --preset ${{ matrix.arch }}-release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DSIMRV_WARNINGS_AS_ERRORS=ON
          -DSIMRV_ENABLE_SDL=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.arch }}-release

      - name: Run CTest gate suite
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate

      - name: Validate source release metadata
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py

      - name: Compute asset names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ -z "${SIMRV_VERSION}" ]]; then
            echo "Failed to parse SIMRV_VERSION from CMakeLists.txt" >&2
            exit 1
          fi

          VERSION_TAG="v${SIMRV_VERSION}"
          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" != "${VERSION_TAG}" ]]; then
            echo "Release tag ${TAG} does not match CMake version tag ${VERSION_TAG}" >&2
            exit 1
          fi

          ASSET_BASE="SimRV-${{ matrix.arch }}-linux-x86_64-${VERSION_TAG}"
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_base=${ASSET_BASE}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/${{ matrix.arch }}-release/SimRV dist/SimRV
          tar -C dist -czf "${{ steps.names.outputs.asset_base }}.tar.gz" SimRV
          cp build/${{ matrix.arch }}-release/SimRV "${{ steps.names.outputs.asset_base }}.bin"
          sha256sum "${{ steps.names.outputs.asset_base }}.tar.gz" > "${{ steps.names.outputs.asset_base }}.sha256"
          sha256sum "${{ steps.names.outputs.asset_base }}.bin" >> "${{ steps.names.outputs.asset_base }}.sha256"

      - name: Validate packaged release
        run: >-
          python3 scripts/release_check.py
          --binary "${{ steps.names.outputs.asset_base }}.bin"
          --archive "${{ steps.names.outputs.asset_base }}.tar.gz"
          --checksum "${{ steps.names.outputs.asset_base }}.sha256"

      - name: Build CPack RPM packages
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="${{ steps.names.outputs.simrv_version }}"
          MAJOR="${MAJOR%%.*}"
          if (( MAJOR < 3 )); then
            echo "Native packages begin with SimRV 3.0"
            exit 0
          fi
          mkdir -p packages
          cpack --config build/${{ matrix.arch }}-release/CPackConfig.cmake -G RPM -B packages
          sha256sum packages/*.rpm > \
            "packages/${{ steps.names.outputs.asset_base }}-rpm.sha256"

      - name: Validate native package contents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rpms < <(find packages -maxdepth 1 -name '*.rpm' -type f | sort)
          test "${#rpms[@]}" -eq 4
          for package in "${rpms[@]}"; do rpm -qpl "$package" >/dev/null; done
          runtime_rpm="$(find packages -maxdepth 1 -name 'simrv-rv*.rpm' -type f)"
          rpm -qpl "$runtime_rpm" | grep -q '/usr/bin/SimRV$'
          if rpm -qpl "$runtime_rpm" | grep -q 'simrv-benchmark'; then
            echo "Runtime RPM unexpectedly contains benchmark tooling" >&2
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}
          path: |
            ${{ steps.names.outputs.asset_base }}.tar.gz
            ${{ steps.names.outputs.asset_base }}.bin
            ${{ steps.names.outputs.asset_base }}.sha256
            packages/*.rpm
            packages/*-rpm.sha256
          retention-days: 14

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.names.outputs.asset_base }}.tar.gz
            ${{ steps.names.outputs.asset_base }}.bin
            ${{ steps.names.outputs.asset_base }}.sha256
            packages/*.rpm
            packages/*-rpm.sha256
          tag_name: ${{ steps.names.outputs.version_tag }}
          prerelease: ${{ contains(steps.names.outputs.version_tag, '-') }}

  debian-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    container:
      image: gcc:16
    strategy:
      fail-fast: false
      matrix:
        arch: [rv32, rv64]
    steps:
      - uses: actions/checkout@v6
      - name: Install package build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip dpkg-dev xz-utils
          python3 -m pip install --break-system-packages cmake==4.3.0 ninja
      - name: Validate release tag
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${SIMRV_VERSION}"
          test "${SIMRV_VERSION%%.*}" -ge 3
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_base=SimRV-${{ matrix.arch }}-linux-x86_64-v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Configure and build
        run: |
          cmake --preset ${{ matrix.arch }}-release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DSIMRV_ENABLE_SDL=OFF
          cmake --build --preset ${{ matrix.arch }}-release --parallel 2
      - name: Validate install tree
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -R package-install-consumer
      - name: Build and validate DEB packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages extracted
          cpack --config build/${{ matrix.arch }}-release/CPackConfig.cmake -G DEB -B packages
          mapfile -t debs < <(find packages -maxdepth 1 -name '*.deb' -type f | sort)
          test "${#debs[@]}" -eq 4
          for package in "${debs[@]}"; do dpkg-deb --contents "$package" >/dev/null; done
          runtime_deb="$(find packages -maxdepth 1 -name 'simrv-rv*.deb' -type f)"
          development_deb="$(find packages -maxdepth 1 -name 'simrv-dev-rv*.deb' -type f)"
          dpkg-deb --contents "$runtime_deb" | grep -q '/usr/bin/SimRV$'
          dpkg-deb --field "$runtime_deb" Depends | grep -q 'libc6'
          if dpkg-deb --contents "$runtime_deb" | grep -q 'simrv-benchmark'; then
            echo "Runtime DEB unexpectedly contains benchmark tooling" >&2
            exit 1
          fi
          dpkg-deb --extract "$runtime_deb" extracted
          dpkg-deb --extract "$development_deb" extracted
          package_dir="$(find extracted/usr -path '*/cmake/SimRV' -type d -print -quit)"
          cmake -S tests/package-consumer -B consumer -D "SimRV_DIR=${PWD}/${package_dir}"
          cmake --build consumer
          sha256sum packages/*.deb > \
            "packages/${{ steps.names.outputs.asset_base }}-deb.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}-deb
          path: |
            packages/*.deb
            packages/*-deb.sha256
          retention-days: 14
      - name: Upload DEB release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*-deb.sha256
          tag_name: ${{ steps.names.outputs.version_tag }}
          prerelease: ${{ contains(steps.names.outputs.version_tag, '-') }}

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v6
      - name: Install documentation tools
        run: dnf install -y doxygen graphviz tar gzip python3
      - name: Validate release metadata
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py
      - name: Build documentation
        run: doxygen Doxyfile
      - name: Package documentation
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("release/release-manifest.json"))["version"])')"
          tar -C docs/api -czf "SimRV-docs-v${VERSION}.tar.gz" html
      - uses: actions/upload-artifact@v7
        with:
          name: SimRV-documentation
          path: SimRV-docs-*.tar.gz
          retention-days: 14
      - name: Upload documentation release asset
        uses: softprops/action-gh-release@v2
        with:
          files: SimRV-docs-*.tar.gz

  reproducibility-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        run: dnf install -y python3
      - name: Validate research interfaces
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py
          mkdir -p repro/results
          python3 -c 'import json,pathlib; pathlib.Path("repro/results/index.json").write_text(json.dumps({"schema_version":1,"status":"framework-only","note":"Raw results and complete evidence are published only after the full release matrix passes."},indent=2)+"\n")'
      - name: Package reproducibility framework
        run: python3 scripts/package_repro.py --results repro/results
      - uses: actions/upload-artifact@v7
        with:
          name: SimRV-reproducibility-framework
          path: |
            SimRV-repro-*.tar.gz
            SimRV-repro-*.sha256
          retention-days: 14
      - name: Upload reproducibility release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SimRV-repro-*.tar.gz
            SimRV-repro-*.sha256
