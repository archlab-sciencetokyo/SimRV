name: Release Binaries

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'zensical.yml'
      - '.github/requirements-docs.txt'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guest-architecture-check:
    name: Guest architecture (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: fedora:44
    strategy:
      fail-fast: false
      matrix:
        arch: [rv32, rv64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build boost-devel libslirp-devel \
            gcc gcc-c++ mold ccache curl tar xz autoconf make which

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: release-fedora44-${{ matrix.arch }}

      - name: Setup RISC-V GCC toolchain
        uses: ./.github/actions/setup-riscv-toolchain

      - name: Setup RISC-V tests
        id: riscv-tests
        uses: ./.github/actions/setup-riscv-tests
        with:
          arch: ${{ matrix.arch }}

      - name: Resolve release version
        id: names
        uses: ./.github/actions/resolve-simrv-version

      - name: Configure
        env:
          RISCV_TESTS_DIR: ${{ steps.riscv-tests.outputs.riscv-tests-dir }}
        run: >-
          cmake --preset ${{ matrix.arch }}-release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_LINKER_TYPE=MOLD
          -DSIMRV_ENABLE_LTO=OFF
          -DSIMRV_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.arch }}-release

      - name: Run CTest gate suite
        env:
          RISCV_TESTS_DIR: ${{ steps.riscv-tests.outputs.riscv-tests-dir }}
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate

      - name: Run GA smoke workflow
        run: build/${{ matrix.arch }}-release/simrv-smoke --simrv build/${{ matrix.arch }}-release/simrv

      - name: Resolve latest ACT4 revision
        if: matrix.arch == 'rv64'
        id: resolve-act4
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git ls-remote --exit-code https://github.com/riscv/riscv-arch-test.git refs/heads/act4 | cut -f1)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the upstream ACT4 branch head" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "RISCV_ARCH_TEST_REVISION=$revision" >> "$GITHUB_ENV"
          echo "ACT4 upstream head: $revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore static ACT4 toolchain cache
        if: matrix.arch == 'rv64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ruby-3.4.12
            ${{ runner.temp }}/sail-riscv-0.16
            ${{ runner.temp }}/act-venv
          key: ${{ runner.os }}-${{ runner.arch }}-act4-static-ruby3.4.12-sail0.16-uv0.13.4-v1

      - name: Restore ACT4 repo and package cache
        if: matrix.arch == 'rv64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/act-gems
            ${{ runner.temp }}/act-bundle
            ${{ runner.temp }}/uv-cache
            ${{ runner.temp }}/uv-python
            ${{ runner.temp }}/riscv-arch-test
          key: ${{ runner.os }}-${{ runner.arch }}-act4-repo-${{ steps.resolve-act4.outputs.revision }}-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-act4-repo-

      - name: Restore generated ACT4 suite
        if: matrix.arch == 'rv64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/act4/output/rva23s64/elfs
            tests/act4/output/rva23s64/test_list.md
            tests/act4/output/rva23s64/simrv-act4-provenance.txt
            tests/act4/output/rva23s64/.simrv-act4-generated
          key: ${{ runner.os }}-${{ runner.arch }}-act4-rva23s64-${{ steps.resolve-act4.outputs.revision }}-gcc15.2.0-sail0.16-${{ hashFiles('tests/act4/simrv-rva23s64/**') }}-v1

      - name: Install ACT4 prerequisites
        if: matrix.arch == 'rv64'
        run: |
          dnf install -y --setopt=install_weak_deps=False python3 python3-pip jq
          if [[ ! -x "$RUNNER_TEMP/ruby-3.4.12/bin/ruby" ]]; then
            dnf install -y --setopt=install_weak_deps=False ruby-build-core ruby-build-ruby \
              make bzip2-devel openssl-devel libyaml-devel libffi-devel \
              readline-devel zlib-ng-compat-devel gdbm-devel ncurses-devel
            ruby-build 3.4.12 "$RUNNER_TEMP/ruby-3.4.12"
          fi
          mkdir -p "$RUNNER_TEMP/act-gems"
          echo "GEM_HOME=$RUNNER_TEMP/act-gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/act-gems/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ruby-3.4.12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ruby-3.4.12/bin/ruby" --version
          if [[ ! -x "$RUNNER_TEMP/act-venv/bin/uv" ]]; then
            python3 -m venv "$RUNNER_TEMP/act-venv"
            "$RUNNER_TEMP/act-venv/bin/pip" install uv==0.13.4
          fi
          echo "$RUNNER_TEMP/act-venv/bin" >> "$GITHUB_PATH"
          if ! find "$RUNNER_TEMP/sail-riscv-0.16" -type f -name sail_riscv_sim -executable -print -quit 2>/dev/null | grep -q .; then
            sail_archive="$RUNNER_TEMP/sail-riscv-Linux-x86_64.tar.gz"
            curl --fail --location --retry 3 \
              https://github.com/riscv/sail-riscv/releases/download/0.16/sail-riscv-Linux-x86_64.tar.gz \
              --output "$sail_archive"
            echo "f9bb8a32b8f3eddbdf69b3a29d96dff4ba1e77f45877165e0478418367da6bee  $sail_archive" \
              | sha256sum --check --status
            mkdir -p "$RUNNER_TEMP/sail-riscv-0.16"
            tar -xzf "$sail_archive" -C "$RUNNER_TEMP/sail-riscv-0.16"
          fi
          sail_sim="$(find "$RUNNER_TEMP/sail-riscv-0.16" -type f -name sail_riscv_sim -print -quit)"
          test -n "$sail_sim" && test -x "$sail_sim"
          dirname "$sail_sim" >> "$GITHUB_PATH"
          ln -sf /opt/riscv/bin/riscv-none-elf-gcc /usr/local/bin/riscv64-linux-gnu-gcc
          ln -sf /opt/riscv/bin/riscv-none-elf-objdump /usr/local/bin/riscv64-linux-gnu-objdump

      - name: Fetch ACT4 and install its tools
        if: matrix.arch == 'rv64'
        env:
          BUNDLE_PATH: ${{ runner.temp }}/act-bundle
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        run: |
          ACT_DIR="$RUNNER_TEMP/riscv-arch-test"
          "$GITHUB_WORKSPACE/scripts/check-act4-upstream.sh" "$RISCV_ARCH_TEST_REVISION"
          if [[ ! -d "$ACT_DIR/.git" ]]; then
            git clone --branch act4 --depth 1 --recurse-submodules \
              https://github.com/riscv/riscv-arch-test.git "$ACT_DIR"
          fi
          if [[ "$(git -C "$ACT_DIR" rev-parse HEAD)" != "$RISCV_ARCH_TEST_REVISION" ]]; then
            git -C "$ACT_DIR" fetch --depth 1 origin "$RISCV_ARCH_TEST_REVISION"
            git -C "$ACT_DIR" checkout --detach "$RISCV_ARCH_TEST_REVISION"
          fi
          git -C "$ACT_DIR" submodule update --init --recursive --depth 1
          echo "ACT4 source commit: $(git -C "$ACT_DIR" rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -x "$ACT_DIR/.venv/bin/act" ]]; then
            (cd "$ACT_DIR" && uv sync --locked)
          fi
          if [[ ! -x "$RUNNER_TEMP/act-gems/bin/bundle" ]]; then
            GEM_HOME="$RUNNER_TEMP/act-gems" \
              "$RUNNER_TEMP/ruby-3.4.12/bin/gem" install bundler --version 4.0.24 \
                --install-dir "$RUNNER_TEMP/act-gems" --no-document
          fi
          if ! (cd "$ACT_DIR/framework/src/act/data" && bundle check >/dev/null 2>&1); then
            (cd "$ACT_DIR/framework/src/act/data" && bundle install)
          fi

      - name: Generate and run full RVA23 ACT4 suite
        if: matrix.arch == 'rv64'
        env:
          ACT_DIR: ${{ runner.temp }}/riscv-arch-test
          ACT_WORKDIR: ${{ github.workspace }}/tests/act4/output
          BUNDLE_PATH: ${{ runner.temp }}/act-bundle
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        shell: bash
        run: |
          set -euo pipefail
          echo "ACT4 source commit: $(git -C "$ACT_DIR" rev-parse HEAD)"
          suite_dir="$ACT_WORKDIR/rva23s64"
          if [[ ! -f "$suite_dir/.simrv-act4-generated" ]]; then
            make -C "$ACT_DIR" \
              CONFIG_FILES="$GITHUB_WORKSPACE/tests/act4/simrv-rva23s64/test_config.yaml" \
              CERTIFICATE=RVA23 JOBS="$(nproc)" CLEAN_INTERMEDIATES=1 \
              WORKDIR="$ACT_WORKDIR"
            test -n "$(find "$suite_dir/elfs" -type f -name '*.elf' -print -quit)"
            touch "$suite_dir/.simrv-act4-generated"
          else
            echo "Using cached ACT4 ELFs for $RISCV_ARCH_TEST_REVISION" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          config="$GITHUB_WORKSPACE/tests/act4/simrv-rva23s64/test_config.yaml"
          elf_count="$(find "$suite_dir/elfs" -type f -name '*.elf' | wc -l)"
          test "$elf_count" -gt 0
          {
            printf 'act_revision=%s\n' "$RISCV_ARCH_TEST_REVISION"
            printf 'profile=RVA23S64\n'
            printf 'vlen=128\n'
            printf 'elf_count=%s\n' "$elf_count"
            printf 'config_sha256=%s\n' \
              "$(sha256sum "$config" | cut -d ' ' -f 1)"
          } > "$suite_dir/simrv-act4-provenance.txt"
          cat "$suite_dir/simrv-act4-provenance.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          report="$ACT_WORKDIR/rva23s64/simrv-report.json"
          set +e
          build/rv64-release/simrv-act \
            --simrv build/rv64-release/simrv \
            --elf-dir "$ACT_WORKDIR/rva23s64/elfs" \
            --report "$report" --jobs "$(nproc)" --vlen 128 --max-failures 1000 \
            --compare-detailed-on-failure
          act_status=$?
          set -e
          # A release claiming RVA23 compliance must pass the complete ACT4 suite.
          # Keep the generated count dynamic because the upstream act4 branch evolves.
          if ! jq -e '.total > 0 and .passed == .total and .failed == 0 and .timeouts == 0' \
            "$report" >/dev/null; then
            echo "ACT4 RVA23 qualification failed; failed tests:" >&2
            jq -r '.tests[] | select(.status != "PASS") | "  - " + .name' "$report" >&2
            exit 1
          fi
          test "$act_status" -eq 0
          jq -r '"ACT4 RVA23 qualification passed: \(.passed)/\(.total) ELFs; 0 failures and 0 timeouts."' \
            "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          "$GITHUB_WORKSPACE/scripts/check-act4-upstream.sh" "$RISCV_ARCH_TEST_REVISION"

      - name: Validate source release metadata
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L release

  rpm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      # Rocky Linux 10 is the supported RPM baseline. GCC Toolset 15 supplies
      # the C++23 library; the executable statically links that runtime.
      # Rocky's CRB repository provides libslirp-devel, which UBI does not publish.
      image: rockylinux/rockylinux:10
    steps:
      - name: Install checkout tools
        shell: bash
        run: dnf install -y git tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        id: names
        uses: ./.github/actions/resolve-simrv-version
      - name: Cache Boost 1.83 headers
        id: cache-boost
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/boost-1.83
          key: rocky10-boost-1.83.0-v1
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False epel-release
          dnf install -y --setopt=install_weak_deps=False \
            gcc-toolset-15-gcc gcc-toolset-15-gcc-c++ \
            gcc-toolset-15-libstdc++-devel gcc gcc-c++ \
            libslirp-devel make python3-pip rpm-build rpmlint findutils binutils \
            bzip2-devel pkgconf-pkg-config wget which ccache
          python3 -m pip install cmake==4.3.0 ninja || \
            python3 -m pip install --break-system-packages cmake==4.3.0 ninja
          for path in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin \
                      /opt/rh/gcc-toolset-15/root/usr/bin; do
            echo "$path" >> "$GITHUB_PATH"
          done
          for tool in cmake ninja ctest; do
            command -v "$tool" >/dev/null || { echo "Missing build tool: $tool" >&2; exit 1; }
          done
          if [[ "${{ steps.cache-boost.outputs.cache-hit }}" != "true" ]]; then
            wget -q https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.bz2 \
              -O /tmp/boost_1_83_0.tar.bz2
            echo '6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e  /tmp/boost_1_83_0.tar.bz2' \
              | sha256sum --check
            tar -xjf /tmp/boost_1_83_0.tar.bz2 -C /tmp
            cd /tmp/boost_1_83_0
            ./bootstrap.sh
            ./b2 --with-headers install --prefix=/opt/boost-1.83
          fi
          {
            echo "Boost_DIR=/opt/boost-1.83/lib/cmake/Boost-1.83.0"
            echo "CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc"
            echo "CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++"
          } >> "$GITHUB_ENV"
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: rockylinux10-rpm
      - name: Configure and build RHEL 10 baseline
        shell: bash
        run: |
          set -euo pipefail
          # The separate guest-architecture gate uses the qualified GCC 16 toolchain;
          # this package job checks the RHEL 10 runtime and RPM consumer baseline.
          cmake --preset rv64-release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSIMRV_ALLOW_UNQUALIFIED_TOOLCHAIN=ON \
            -DSIMRV_ENABLE_LTO=OFF \
            -DSIMRV_ENABLE_LINUX_TOOLS=ON \
            -DSIMRV_X86_64_V3_BASELINE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build/rv64-release --target simrv-package-binaries --parallel "$(nproc)"
          cmake --build build/rv64-release --target simrv-linux-builder --parallel "$(nproc)"
          build/rv64-release/simrv-linux-builder --help | grep -q -- '--rootfs-overlay'
          if readelf -d build/rv64-release/simrv | grep -Eq 'libstdc\+\+|libgcc_s'; then
            echo "RHEL 10 runtime unexpectedly depends on a dynamic GCC C++ runtime" >&2
            readelf -d build/rv64-release/simrv | grep -E 'NEEDED.*(libstdc\+\+|libgcc_s)' >&2
            exit 1
          fi
          max_glibc="$(readelf --version-info build/rv64-release/simrv \
            | sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p' | sort -V | tail -n 1)"
          if [[ -z "$max_glibc" ]]; then
            echo "Could not determine the maximum GLIBC version required by the RHEL 10 runtime" >&2
            exit 1
          fi
          echo "RHEL 10 runtime maximum GLIBC requirement: $max_glibc"
          if [[ "$(printf '%s\n' "$max_glibc" 2.39 | sort -V | tail -n 1)" != 2.39 ]]; then
            echo "RHEL 10 runtime must require GLIBC 2.39 or older (found $max_glibc)" >&2
            exit 1
          fi
          ctest --test-dir build/rv64-release --output-on-failure -R package-install-consumer
      - name: Build and validate RPM packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cpack --config build/rv64-release/CPackConfig.cmake -G RPM -B packages
          mapfile -t rpms < <(find packages -maxdepth 1 -name '*.rpm' -type f | sort)
          test "${#rpms[@]}" -eq 4
          for package in "${rpms[@]}"; do rpm -qpl "$package" >/dev/null; done
          runtime_rpm="$(find packages -maxdepth 1 -name 'simrv-[0-9]*.rpm' -type f)"
          tools_rpm="$(find packages -maxdepth 1 -name 'simrv-tools-[0-9]*.rpm' -type f)"
          development_rpm="$(find packages -maxdepth 1 -name 'simrv-devel-[0-9]*.rpm' -type f)"
          rpm -qpl "$runtime_rpm" > packages/runtime-rpm-contents.txt
          rpm -qpl "$tools_rpm" > packages/tools-rpm-contents.txt
          rpm -qpl "$development_rpm" > packages/development-rpm-contents.txt
          grep -q '/usr/bin/simrv$' packages/runtime-rpm-contents.txt
          grep -q '/usr/bin/simrv-config-wizard$' packages/tools-rpm-contents.txt
          grep -q '/usr/bin/simrv-linux-builder$' packages/tools-rpm-contents.txt
          grep -q '/usr/bin/simrv-linux-builder-post-build$' packages/tools-rpm-contents.txt
          grep -q '/usr/share/SimRV/LinuxBuilder/scripts/linux-versions.conf$' packages/tools-rpm-contents.txt
          grep -q '/usr/share/SimRV/LinuxBuilder/scripts/templates/virt-rv64.dts$' packages/tools-rpm-contents.txt
          grep -q '/usr/share/SimRV/LinuxBuilder/configs/buildroot/simrv-buildroot/rv64_defconfig$' packages/tools-rpm-contents.txt
          if grep -q '/usr/bin/simrv-config-wizard$' packages/runtime-rpm-contents.txt; then
            echo "Configuration wizard unexpectedly belongs to the runtime RPM" >&2
            exit 1
          fi
          if grep -q '/usr/bin/simrv-linux-builder' packages/runtime-rpm-contents.txt; then
            echo "Linux builder unexpectedly belongs to the runtime RPM" >&2
            exit 1
          fi
          if grep -Eq '/simrv/plugins/|/libsimrv-.*\.so$' packages/runtime-rpm-contents.txt; then
            echo "Runtime RPM unexpectedly contains plugin libraries" >&2
            exit 1
          fi
          grep -q '/include/simrv/core/MachineConfig.hpp$' packages/development-rpm-contents.txt
          grep -q '/libsimrv-runtime.a$' packages/development-rpm-contents.txt
          grep -q '/cmake/SimRV/SimRVConfig.cmake$' packages/development-rpm-contents.txt
          if rpm -qp --requires "$runtime_rpm" | grep -Eq 'libstdc\+\+|libgcc_s|GLIBCXX'; then
            echo "Runtime RPM unexpectedly requires the GCC Toolset C++ runtime" >&2
            exit 1
          fi
          rpm -qp --requires "$development_rpm" | grep -Fx \
            "simrv = $(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$runtime_rpm")"
          rpmlint_config=packaging/simrv.rpmlintrc
          rpmlint_version="$(rpmlint --version)"
          if [[ "$(printf '%s\n%s\n' 2.9.0 "$rpmlint_version" | sort -V | sed -n '1p')" != 2.9.0 ]]; then
            rpmlint_config=/tmp/simrv-rpmlintrc
            cp packaging/simrv.rpmlintrc "$rpmlint_config"
            # rpmlint 2.8 flags the SDK archive because it has no debug info.
            cat >> "$rpmlint_config" <<'EOF'
          addFilter("static-library-without-debuginfo .*libsimrv-runtime[.]a")
          EOF
          fi
          rpmlint --rpmlintrc "$rpmlint_config" packages/*.rpm
          dnf install -y packages/*.rpm
          simrv --version | grep -F "${{ steps.names.outputs.simrv_version }}"
          cmake -S tests/package-consumer -B packages/consumer-build
          cmake --build packages/consumer-build
          packages/consumer-build/simrv-package-consumer
          dnf remove -y simrv-devel
          rpm -q simrv >/dev/null
          if rpm -q simrv-devel >/dev/null 2>&1; then
            echo "simrv-devel remained installed after removal" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.asset_base }}-rpm
          path: packages/*.rpm
          retention-days: 14

  portable-musl:
    name: Portable Linux archive (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        id: names
        uses: ./.github/actions/resolve-simrv-version
        with:
          arch: ${{ matrix.arch }}
          require-major-v3: 'false'
      - name: Cache Alpine libslirp and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/musl-usr-local
            ${{ runner.temp }}/musl-ccache
          key: musl-${{ matrix.arch }}-libslirp4.9.5-${{ github.sha }}
          restore-keys: |
            musl-${{ matrix.arch }}-libslirp4.9.5-
      - name: Build static musl archive inside Alpine
        shell: bash
        env:
          SIMRV_ASSET_BASE: ${{ steps.names.outputs.asset_base }}
          SIMRV_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/musl-usr-local" "$RUNNER_TEMP/musl-ccache"
          SIMRV_HOST_UID="$(id -u)"
          SIMRV_HOST_GID="$(id -g)"
          export SIMRV_HOST_UID SIMRV_HOST_GID
          docker run --rm \
            -e SIMRV_ASSET_BASE -e SIMRV_ARCH -e SIMRV_HOST_UID -e SIMRV_HOST_GID \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/musl-usr-local:/usr/local" \
            -v "$RUNNER_TEMP/musl-ccache:/ccache" \
            -w /workspace \
            alpine:edge sh .github/scripts/portable-musl-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.asset_base }}
          path: ${{ steps.names.outputs.asset_base }}.tar.gz
          retention-days: 14

  debian-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # Build against Noble's glibc baseline. GCC 15 provides std::flat_map and
      # std::flat_set; static C++ runtime linkage keeps the package runnable on
      # stock Noble without requiring the toolchain PPA at runtime.
      image: ubuntu:24.04
    steps:
      - name: Cache pip wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cache/pip
          key: ubuntu2404-pip-cmake4.3.0-ninja-v1
      - name: Install package build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            git software-properties-common \
            libboost1.83-dev libglib2.0-dev libslirp-dev make binutils pkg-config \
            python3 python3-pip dpkg-dev xz-utils lintian ccache
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-15 g++-15
          python3 -m pip install cmake==4.3.0 ninja || \
            python3 -m pip install --break-system-packages cmake==4.3.0 ninja
          echo "CC=gcc-15" >> "$GITHUB_ENV"
          echo "CXX=g++-15" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        id: names
        uses: ./.github/actions/resolve-simrv-version
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ubuntu2404-deb
      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset rv64-release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS=-ffat-lto-objects \
            -DSIMRV_ALLOW_UNQUALIFIED_TOOLCHAIN=ON \
            -DSIMRV_X86_64_V3_BASELINE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build/rv64-release --target simrv-package-binaries --parallel "$(nproc)"
          max_glibc="$(readelf --version-info build/rv64-release/simrv \
            | sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p' | sort -V | tail -n 1)"
          if [[ -z "$max_glibc" ]]; then
            echo "Could not determine the maximum GLIBC version required by the Ubuntu 24.04 runtime" >&2
            exit 1
          fi
          echo "Ubuntu 24.04 runtime maximum GLIBC requirement: $max_glibc"
          if [[ "$(printf '%s\n' "$max_glibc" 2.39 | sort -V | tail -n 1)" != 2.39 ]]; then
            echo "Ubuntu 24.04 runtime must require GLIBC 2.39 or older (found $max_glibc)" >&2
            exit 1
          fi
          if readelf -d build/rv64-release/simrv | grep -Eq 'libstdc\+\+|libgcc_s'; then
            echo "Ubuntu 24.04 runtime unexpectedly depends on a dynamic GCC C++ runtime" >&2
            readelf -d build/rv64-release/simrv | grep -E 'NEEDED.*(libstdc\+\+|libgcc_s)' >&2
            exit 1
          fi
          if readelf --version-info build/rv64-release/simrv | grep -q 'Name: GLIBCXX_'; then
            echo "Ubuntu DEB runtime unexpectedly depends on a dynamic libstdc++ symbol" >&2
            exit 1
          fi
      - name: Validate install tree
        run: ctest --test-dir build/rv64-release --output-on-failure -R package-install-consumer
      - name: Build and validate DEB packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cpack --config build/rv64-release/CPackConfig.cmake \
            -D CPACK_DEBIAN_RUNTIME_PACKAGE_DEPENDS=libc6 -G DEB -B packages
          set -x
          mapfile -t debs < <(find packages -maxdepth 1 -name '*.deb' -type f | sort)
          test "${#debs[@]}" -eq 4
          for package in "${debs[@]}"; do dpkg-deb --contents "$package" >/dev/null; done
          runtime_deb="$(find packages -maxdepth 1 -name 'simrv_[0-9]*.deb' -type f)"
          tools_deb="$(find packages -maxdepth 1 -name 'simrv-tools_[0-9]*.deb' -type f)"
          development_deb="$(find packages -maxdepth 1 -name 'simrv-devel_[0-9]*.deb' -type f)"
          dpkg-deb --contents "$runtime_deb" > packages/runtime-deb-contents.txt
          dpkg-deb --contents "$tools_deb" > packages/tools-deb-contents.txt
          dpkg-deb --contents "$development_deb" > packages/development-deb-contents.txt
          grep -q '/usr/bin/simrv$' packages/runtime-deb-contents.txt
          grep -q '/usr/bin/simrv-config-wizard$' packages/tools-deb-contents.txt
          grep -q '/usr/bin/simrv-linux-builder$' packages/tools-deb-contents.txt
          grep -q '/usr/bin/simrv-linux-builder-post-build$' packages/tools-deb-contents.txt
          grep -q '/usr/share/SimRV/LinuxBuilder/scripts/linux-versions.conf$' packages/tools-deb-contents.txt
          grep -q '/usr/share/SimRV/LinuxBuilder/scripts/templates/virt-rv64.dts$' packages/tools-deb-contents.txt
          grep -q '/usr/share/SimRV/LinuxBuilder/configs/buildroot/simrv-buildroot/rv64_defconfig$' packages/tools-deb-contents.txt
          if grep -q '/usr/bin/simrv-config-wizard$' packages/runtime-deb-contents.txt; then
            echo "Configuration wizard unexpectedly belongs to the runtime DEB" >&2
            exit 1
          fi
          if grep -q '/usr/bin/simrv-linux-builder' packages/runtime-deb-contents.txt; then
            echo "Linux builder unexpectedly belongs to the runtime DEB" >&2
            exit 1
          fi
          if grep -Eq '/simrv/plugins/|/libsimrv-.*\.so$' packages/runtime-deb-contents.txt; then
            echo "Runtime DEB unexpectedly contains plugin libraries" >&2
            exit 1
          fi
          grep -q '/include/simrv/core/MachineConfig.hpp$' packages/development-deb-contents.txt
          grep -q '/libsimrv-runtime.a$' packages/development-deb-contents.txt
          grep -q '/cmake/SimRV/SimRVConfig.cmake$' packages/development-deb-contents.txt
          if grep -Eq '/include/simrv/|/libsimrv-runtime\.a$|/cmake/SimRV/' packages/runtime-deb-contents.txt; then
            echo "Runtime DEB unexpectedly contains SDK files" >&2
            exit 1
          fi
          dpkg-deb --field "$runtime_deb" Depends > packages/runtime-deb-depends.txt
          grep -q 'libc6' packages/runtime-deb-depends.txt
          if grep -Eq 'libgcc-s1|libstdc\+\+6' packages/runtime-deb-depends.txt; then
            echo "Runtime DEB unexpectedly depends on the C++ compiler runtime" >&2
            exit 1
          fi
          runtime_version="$(dpkg-deb --field "$runtime_deb" Version)"
          dpkg-deb --field "$development_deb" Depends | grep -F "simrv (= ${runtime_version})"
          if grep -q 'simrv-benchmark' packages/runtime-deb-contents.txt; then
            echo "Runtime DEB unexpectedly contains benchmark tooling" >&2
            exit 1
          fi
          apt-get install -y ./packages/*.deb
          simrv --version | grep -F "${{ steps.names.outputs.simrv_version }}"
          cmake -S tests/package-consumer -B packages/consumer-build
          cmake --build packages/consumer-build
          packages/consumer-build/simrv-package-consumer
          # Debian Lintian cannot inspect GCC LTO-only archives. The consumer
          # build above verifies the shipped archive links successfully.
          lintian --fail-on warning \
            --suppress-tags malformed-contact,too-many-contacts,no-changelog,no-copyright-file,uncompressed-manual-page,unstripped-binary-or-object,hardening-no-pie,binary-from-other-architecture,statically-linked-binary,no-code-sections \
            packages/*.deb
          apt-get remove -y simrv-devel
          dpkg-query -W -f='${Status}' simrv | grep -Fx 'install ok installed'
          development_status="$(dpkg-query -W -f='${Status}' simrv-devel 2>/dev/null || true)"
          if [[ "${development_status}" == 'install ok installed' ]]; then
            echo "simrv-devel remained installed after removal" >&2
            exit 1
          fi
          test ! -e /usr/include/simrv/core/MachineConfig.hpp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.asset_base }}-deb
          path: packages/*.deb
          retention-days: 14

  package-distro-matrix:
    needs: [rpm-packages, debian-packages, portable-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            family: rpm
          - image: rockylinux/rockylinux:10
            family: rpm
          - image: ubuntu:24.04
            family: deb
          - image: debian:sid
            family: deb
          - image: fedora:40
            family: tgz
          - image: ubuntu:22.04
            family: tgz
          - image: ubuntu:24.04
            family: tgz
          - image: debian:12
            family: tgz
          - image: debian:13
            family: tgz
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: SimRV-linux-x86_64-v*
          path: staging
          merge-multiple: true
      - name: Install runtime package
        shell: bash
        run: |
          set -euo pipefail
          simrv_command=simrv
          if [[ "${{ matrix.family }}" == tgz ]]; then
            archive="$(find staging -name 'SimRV-linux-x86_64-v*.tar.gz' -type f | head -n 1)"
            test -n "${archive}"
            mkdir extracted
            tar -xzf "${archive}" -C extracted
            test -x extracted/usr/bin/simrv
            simrv_command=extracted/usr/bin/simrv
          elif [[ "${{ matrix.family }}" == rpm ]]; then
            dnf install -y findutils
            runtime="$(find staging -name 'simrv-[0-9]*.rpm' -type f | head -n 1)"
            test -n "${runtime}"
            dnf install -y "${runtime}"
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            runtime="$(find staging -name 'simrv_[0-9]*_amd64.deb' -type f | head -n 1)"
            test -n "${runtime}"
            apt-get install -y "./${runtime}"
          fi
          "${simrv_command}" --version
          if [[ "${{ matrix.family }}" != tgz ]]; then
            command -v simrv
          fi

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [guest-architecture-check, rpm-packages, debian-packages, portable-musl, package-distro-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release version
        id: names
        uses: ./.github/actions/resolve-simrv-version
      - name: Install native repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends createrepo-c dpkg-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: SimRV-linux-*-v*
          path: staging
          merge-multiple: true
      - name: Bundle native packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.names.outputs.simrv_version }}"
          mkdir -p dist rpm-packages deb-packages
          find staging -type f -name '*.rpm' -exec cp {} rpm-packages/ \;
          find staging -type f -name '*.deb' -exec cp {} deb-packages/ \;
          test "$(find rpm-packages -type f -name '*.rpm' | wc -l)" -eq 4
          test "$(find deb-packages -type f -name '*.deb' | wc -l)" -eq 4
          createrepo_c rpm-packages
          test -f rpm-packages/repodata/repomd.xml
          grep -q 'type="primary"' rpm-packages/repodata/repomd.xml
          (cd deb-packages && dpkg-scanpackages . /dev/null > Packages)
          test "$(grep -c '^Package: ' deb-packages/Packages)" -eq 5
          grep -q '^Package: simrv-devel$' deb-packages/Packages
          grep -q '^Filename: \./simrv' deb-packages/Packages
          grep -q '^Depends: simrv ' deb-packages/Packages
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C rpm-packages -czf "dist/SimRV-rpm-packages-v${VERSION}.tar.gz" .
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C deb-packages -czf "dist/SimRV-deb-packages-v${VERSION}.tar.gz" .
          cp staging/SimRV-linux-x86_64-v${VERSION}.tar.gz dist/
          cp staging/SimRV-linux-aarch64-v${VERSION}.tar.gz dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SimRV-release-assets
          path: dist/*.tar.gz
          retention-days: 14
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload curated release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
