name: Release Binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RISCV_TESTS_REVISION: 933a897d8631773f385d45938facc466dddc7514

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    container:
      image: fedora:44

    strategy:
      fail-fast: false
      matrix:
        arch: [rv32, rv64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          dnf update -y
          dnf install -y git cmake ninja-build gcc gcc-c++ clang-tools-extra wget tar xz autoconf make which rpm-build rpmlint

      - name: Fetch and compile riscv-tests
        run: |
          # Download and extract prebuilt xPack RISC-V GCC toolchain
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
          mkdir -p /opt/riscv
          tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt/riscv --strip-components=1
          
          # Add toolchain bin directory to GITHUB_PATH for subsequent steps
          echo "/opt/riscv/bin" >> $GITHUB_PATH
          
          # Expose in current execution path
          export PATH="/opt/riscv/bin:$PATH"

          # Clone and build riscv-tests
          git clone https://github.com/riscv-software-src/riscv-tests.git "$RUNNER_TEMP/riscv-tests"
          cd "$RUNNER_TEMP/riscv-tests"
          git checkout --detach "$RISCV_TESTS_REVISION"
          git submodule update --init --recursive
          autoconf
          ./configure
          ARCH="${{ matrix.arch }}"
          make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN="${ARCH#rv}"
          if [[ "${ARCH}" == "rv64" ]]; then
            make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN=32
          fi

      - name: Configure
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: >-
          cmake --preset ${{ matrix.arch }}-release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DSIMRV_WARNINGS_AS_ERRORS=ON
          -DSIMRV_ENABLE_SDL=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.arch }}-release

      - name: Run CTest gate suite
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate

      - name: Validate source release metadata
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py

      - name: Compute asset names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ -z "${SIMRV_VERSION}" ]]; then
            echo "Failed to parse SIMRV_VERSION from CMakeLists.txt" >&2
            exit 1
          fi

          VERSION_TAG="v${SIMRV_VERSION}"
          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" != "${VERSION_TAG}" ]]; then
            echo "Release tag ${TAG} does not match CMake version tag ${VERSION_TAG}" >&2
            exit 1
          fi

          ASSET_BASE="SimRV-linux-x86_64-${VERSION_TAG}"
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_base=${ASSET_BASE}" >> "$GITHUB_OUTPUT"

      - name: Build CPack RPM packages
        if: matrix.arch == 'rv64'
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="${{ steps.names.outputs.simrv_version }}"
          MAJOR="${MAJOR%%.*}"
          if (( MAJOR < 3 )); then
            echo "Native packages begin with SimRV 3.0"
            exit 0
          fi
          mkdir -p packages
          cpack --config build/${{ matrix.arch }}-release/CPackConfig.cmake -G RPM -B packages

      - name: Validate native package contents
        if: matrix.arch == 'rv64'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rpms < <(find packages -maxdepth 1 -name '*.rpm' -type f | sort)
          test "${#rpms[@]}" -eq 3
          for package in "${rpms[@]}"; do rpm -qpl "$package" >/dev/null; done
          runtime_rpm="$(find packages -maxdepth 1 -name 'simrv-[0-9]*.rpm' -type f)"
          rpm -qpl "$runtime_rpm" > packages/runtime-rpm-contents.txt
          grep -q '/usr/bin/simrv$' packages/runtime-rpm-contents.txt
          if grep -q 'simrv-benchmark' packages/runtime-rpm-contents.txt; then
            echo "Runtime RPM unexpectedly contains benchmark tooling" >&2
            exit 1
          fi
          rpmlint --rpmlintrc packaging/simrv.rpmlintrc packages/*.rpm
          dnf install -y packages/*.rpm
          simrv --version | grep -F "${{ steps.names.outputs.simrv_version }}"

      - name: Upload workflow artifacts
        if: matrix.arch == 'rv64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}-rpm
          path: |
            packages/*.rpm
          retention-days: 14

  portable-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      # Use the same GCC baseline as the release builds, with Debian's musl
      # specs wrapper for a genuinely static musl-linked executable.
      image: gcc:16
    steps:
      - uses: actions/checkout@v6
      - name: Install musl build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash musl-tools libstdc++-14-dev \
            python3 python3-pip tar gzip file ca-certificates
          python3 -m pip install --break-system-packages cmake==4.3.0 ninja
      - name: Validate release tag
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${SIMRV_VERSION}"
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_base=SimRV-linux-x86_64-v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build static RV64 runtime
        shell: bash
        run: |
          set -euo pipefail
          musl_specs=/usr/lib/x86_64-linux-musl/musl-gcc.specs
          test -f "${musl_specs}"
          atomic_archive="$(gcc -print-file-name=libatomic.a)"
          test -f "${atomic_archive}"
          atomic_dir="$(mktemp -d)"
          ln -s "${atomic_archive}" "${atomic_dir}/libatomic_asneeded.a"
          stdcxx_archive="$(find /usr/lib/gcc /usr/local/lib/gcc -type f -name libstdc++.a -print -quit)"
          test -f "${stdcxx_archive}"
          stdcxx_dir="$(dirname "${stdcxx_archive}")"
          cmake -S . -B build/rv64-musl-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSIMRV_XLEN=64 \
            -DSIMRV_X86_64_V3_BASELINE=OFF \
            -DSIMRV_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-specs=${musl_specs}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${atomic_dir} -L${stdcxx_dir} -static -static-libgcc -static-libstdc++"
          cmake --build build/rv64-musl-release --parallel 2
          file build/rv64-musl-release/simrv | grep -E 'statically linked|static-pie linked'
          ! ldd build/rv64-musl-release/simrv
      - name: Package and validate static archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portable-package
          cpack --config build/rv64-musl-release/CPackConfig.cmake -G TGZ \
            -D CPACK_COMPONENTS_ALL=Runtime -B portable-package
          mapfile -t archives < <(find portable-package -maxdepth 1 -name '*.tar.gz' -type f)
          test "${#archives[@]}" -eq 1
          mv "${archives[0]}" "${{ steps.names.outputs.asset_base }}.tar.gz"
          python3 scripts/release_check.py --binary build/rv64-musl-release/simrv \
            --archive "${{ steps.names.outputs.asset_base }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}
          path: ${{ steps.names.outputs.asset_base }}.tar.gz
          retention-days: 14

  debian-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    container:
      image: gcc:16
    steps:
      - uses: actions/checkout@v6
      - name: Install package build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip dpkg-dev xz-utils lintian
          python3 -m pip install --break-system-packages cmake==4.3.0 ninja
      - name: Validate release tag
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${SIMRV_VERSION}"
          test "${SIMRV_VERSION%%.*}" -ge 3
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_base=SimRV-linux-x86_64-v${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Configure and build
        run: |
          cmake --preset rv64-release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DSIMRV_ENABLE_SDL=OFF
          cmake --build --preset rv64-release --parallel 2
      - name: Validate install tree
        run: ctest --test-dir build/rv64-release --output-on-failure -R package-install-consumer
      - name: Build and validate DEB packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cpack --config build/rv64-release/CPackConfig.cmake -G DEB -B packages
          mapfile -t debs < <(find packages -maxdepth 1 -name '*.deb' -type f | sort)
          test "${#debs[@]}" -eq 3
          for package in "${debs[@]}"; do dpkg-deb --contents "$package" >/dev/null; done
          runtime_deb="$(find packages -maxdepth 1 -name 'simrv_[0-9]*.deb' -type f)"
          dpkg-deb --contents "$runtime_deb" > packages/runtime-deb-contents.txt
          grep -q '/usr/bin/simrv$' packages/runtime-deb-contents.txt
          dpkg-deb --field "$runtime_deb" Depends > packages/runtime-deb-depends.txt
          grep -q 'libc6' packages/runtime-deb-depends.txt
          if grep -q 'simrv-benchmark' packages/runtime-deb-contents.txt; then
            echo "Runtime DEB unexpectedly contains benchmark tooling" >&2
            exit 1
          fi
          lintian --fail-on error \
            --suppress-tags malformed-contact,too-many-contacts,no-changelog,no-copyright-file,uncompressed-manual-page,unstripped-binary-or-object,hardening-no-pie \
            packages/*.deb
          apt-get install -y ./packages/*.deb
          simrv --version | grep -F "${{ steps.names.outputs.simrv_version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}-deb
          path: packages/*.deb
          retention-days: 14

  package-distro-matrix:
    needs: [build-and-upload, debian-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            family: rpm
          - image: debian:sid
            family: deb
          - image: fedora:40
            family: tgz
          - image: ubuntu:22.04
            family: tgz
          - image: ubuntu:24.04
            family: tgz
          - image: debian:12
            family: tgz
          - image: debian:13
            family: tgz
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: SimRV-linux-x86_64-v*
          path: staging
          merge-multiple: true
      - name: Install runtime package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.family }}" == tgz ]]; then
            archive="$(find staging -name 'SimRV-linux-x86_64-v*.tar.gz' -type f | head -n 1)"
            test -n "${archive}"
            mkdir extracted
            tar -xzf "${archive}" -C extracted
            test -x extracted/usr/bin/simrv
            extracted/usr/bin/simrv --version
          elif [[ "${{ matrix.family }}" == rpm ]]; then
            dnf install -y findutils
            runtime="$(find staging -name 'simrv-[0-9]*.rpm' -type f | head -n 1)"
            test -n "${runtime}"
            dnf install -y "${runtime}"
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            runtime="$(find staging -name 'simrv_[0-9]*_amd64.deb' -type f | head -n 1)"
            test -n "${runtime}"
            apt-get install -y "${runtime}"
          fi
          simrv --version
          command -v simrv

  publish-release:
    needs: [build-and-upload, debian-packages, portable-musl, package-distro-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install native repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends createrepo-c dpkg-dev
      - uses: actions/download-artifact@v8
        with:
          pattern: SimRV-linux-x86_64-v*
          path: staging
          merge-multiple: true
      - name: Bundle native packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          mkdir -p dist rpm-packages deb-packages
          find staging -type f -name '*.rpm' -exec cp {} rpm-packages/ \;
          find staging -type f -name '*.deb' -exec cp {} deb-packages/ \;
          test "$(find rpm-packages -type f -name '*.rpm' | wc -l)" -eq 3
          test "$(find deb-packages -type f -name '*.deb' | wc -l)" -eq 3
          createrepo_c rpm-packages
          test -f rpm-packages/repodata/repomd.xml
          grep -q 'type="primary"' rpm-packages/repodata/repomd.xml
          (cd deb-packages && dpkg-scanpackages . /dev/null > Packages)
          test "$(grep -c '^Package: ' deb-packages/Packages)" -eq 3
          grep -q '^Filename: \./simrv' deb-packages/Packages
          grep -q '^Depends: simrv ' deb-packages/Packages
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C rpm-packages -czf "dist/SimRV-rpm-packages-v${VERSION}.tar.gz" .
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C deb-packages -czf "dist/SimRV-deb-packages-v${VERSION}.tar.gz" .
          cp staging/SimRV-linux-x86_64-v${VERSION}.tar.gz dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
      - uses: actions/upload-artifact@v7
        with:
          name: SimRV-release-assets
          path: dist/*.tar.gz
          retention-days: 14
      - name: Upload curated release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
