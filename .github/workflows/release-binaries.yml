name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example, v2.0.0-rc.9)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RISCV_TESTS_REVISION: 933a897d8631773f385d45938facc466dddc7514

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10

    strategy:
      matrix:
        arch: [rv32, rv64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install build tools
        run: |
          dnf update -y
          dnf install -y dnf-plugins-core
          dnf config-manager --enable crb || dnf config-manager --set-enabled crb || true
          dnf install -y git cmake ninja-build gcc gcc-c++ clang-tools-extra wget tar xz autoconf make which

      - name: Fetch and compile riscv-tests
        run: |
          # Download and extract prebuilt xPack RISC-V GCC toolchain
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
          mkdir -p /opt/riscv
          tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt/riscv --strip-components=1
          
          # Add toolchain bin directory to GITHUB_PATH for subsequent steps
          echo "/opt/riscv/bin" >> $GITHUB_PATH
          
          # Expose in current execution path
          export PATH="/opt/riscv/bin:$PATH"

          # Clone and build riscv-tests
          git clone https://github.com/riscv-software-src/riscv-tests.git "$RUNNER_TEMP/riscv-tests"
          cd "$RUNNER_TEMP/riscv-tests"
          git checkout --detach "$RISCV_TESTS_REVISION"
          git submodule update --init --recursive
          autoconf
          ./configure
          ARCH="${{ matrix.arch }}"
          make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN="${ARCH#rv}"

      - name: Configure
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: >-
          cmake --preset ${{ matrix.arch }}-release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DSIMRV_WARNINGS_AS_ERRORS=ON
          -DSIMRV_ENABLE_SDL=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.arch }}-release

      - name: Run CTest gate suite
        env:
          RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
        run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate

      - name: Validate source release metadata
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py

      - name: Compute asset names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SIMRV_VERSION="$(sed -nE 's/^set\(SIMRV_VERSION "([^"]+)"\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [[ -z "${SIMRV_VERSION}" ]]; then
            echo "Failed to parse SIMRV_VERSION from CMakeLists.txt" >&2
            exit 1
          fi

          VERSION_TAG="v${SIMRV_VERSION}"
          TAG="${GITHUB_REF_NAME}"
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          if [[ -n "${{ github.event.release.tag_name }}" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [[ "${TAG}" != "${VERSION_TAG}" ]]; then
            echo "Release tag ${TAG} does not match CMake version tag ${VERSION_TAG}" >&2
            exit 1
          fi

          ASSET_BASE="SimRV-${{ matrix.arch }}-linux-x86_64-${VERSION_TAG}"
          echo "simrv_version=${SIMRV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_base=${ASSET_BASE}" >> "$GITHUB_OUTPUT"

      - name: Package binary and user scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/scripts
          cp build/${{ matrix.arch }}-release/SimRV dist/SimRV
          cp scripts/README.md dist/scripts/
          cp scripts/benchmark.py dist/scripts/
          cp scripts/benchmark.sh dist/scripts/
          cp scripts/compare_arch.py dist/scripts/
          cp scripts/run_benchmarks.py dist/scripts/
          cp scripts/compare_benchmarks.py dist/scripts/
          cp scripts/build-linux-image.sh dist/scripts/
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE
          tar -C dist -czf "${{ steps.names.outputs.asset_base }}.tar.gz" SimRV scripts README.md LICENSE
          cp build/${{ matrix.arch }}-release/SimRV "${{ steps.names.outputs.asset_base }}.bin"
          sha256sum "${{ steps.names.outputs.asset_base }}.tar.gz" > "${{ steps.names.outputs.asset_base }}.sha256"
          sha256sum "${{ steps.names.outputs.asset_base }}.bin" >> "${{ steps.names.outputs.asset_base }}.sha256"

      - name: Validate packaged release
        run: >-
          python3 scripts/release_check.py
          --binary "${{ steps.names.outputs.asset_base }}.bin"
          --archive "${{ steps.names.outputs.asset_base }}.tar.gz"
          --checksum "${{ steps.names.outputs.asset_base }}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.asset_base }}
          path: |
            ${{ steps.names.outputs.asset_base }}.tar.gz
            ${{ steps.names.outputs.asset_base }}.bin
            ${{ steps.names.outputs.asset_base }}.sha256

      - name: Upload release assets
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.names.outputs.asset_base }}.tar.gz
            ${{ steps.names.outputs.asset_base }}.bin
            ${{ steps.names.outputs.asset_base }}.sha256
          tag_name: ${{ steps.names.outputs.version_tag }}
          prerelease: ${{ github.ref_name == 'dev' || github.event.release.target_commitish == 'dev' || contains(steps.names.outputs.version_tag, '-') }}

  documentation:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install documentation tools
        run: dnf install -y doxygen graphviz tar gzip python3
      - name: Validate release metadata
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py
      - name: Build documentation
        run: doxygen Doxyfile
      - name: Package documentation
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("release/release-manifest.json"))["version"])')"
          tar -C docs/api -czf "SimRV-docs-v${VERSION}.tar.gz" html
      - uses: actions/upload-artifact@v7
        with:
          name: SimRV-documentation
          path: SimRV-docs-*.tar.gz
      - name: Upload documentation release asset
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SimRV-docs-*.tar.gz

  reproducibility-framework:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Python
        run: dnf install -y python3
      - name: Validate research interfaces
        run: |
          python3 scripts/release_check.py
          python3 tests/ReleaseToolTests.py
          mkdir -p repro/results
          python3 -c 'import json,pathlib; pathlib.Path("repro/results/index.json").write_text(json.dumps({"schema_version":1,"status":"framework-only","note":"Raw results and complete evidence are published only after the full release matrix passes."},indent=2)+"\n")'
      - name: Package reproducibility framework
        run: python3 scripts/package_repro.py --results repro/results
      - uses: actions/upload-artifact@v7
        with:
          name: SimRV-reproducibility-framework
          path: |
            SimRV-repro-*.tar.gz
            SimRV-repro-*.sha256
      - name: Upload reproducibility release asset
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SimRV-repro-*.tar.gz
            SimRV-repro-*.sha256
