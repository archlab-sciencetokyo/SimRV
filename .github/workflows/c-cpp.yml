name: C/C++ CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

env:
  RISCV_TESTS_REVISION: 933a897d8631773f385d45938facc466dddc7514
  VECTOR_TESTS_REVISION: f76bff121dce91b6b23e1d37be77a5e44af914c3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10

    strategy:
      fail-fast: false
      matrix:
        arch: [rv32, rv64]
        compiler: [gcc, clang]

    steps:
    - uses: actions/checkout@v6

    - name: Install build tools
      run: |
        dnf update -y
        dnf install -y dnf-plugins-core
        dnf config-manager --enable crb || dnf config-manager --set-enabled crb || true
        dnf install -y git cmake ninja-build gcc gcc-c++ clang clang-tools-extra wget tar xz autoconf make which golang

    - name: Fetch and compile riscv-tests
      run: |
        # Download and extract prebuilt xPack RISC-V GCC toolchain
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
        mkdir -p /opt/riscv
        tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt/riscv --strip-components=1
        
        # Add toolchain bin directory to GITHUB_PATH for subsequent steps
        echo "/opt/riscv/bin" >> $GITHUB_PATH
        
        # Expose in current execution path
        export PATH="/opt/riscv/bin:$PATH"

        # Clone and build riscv-tests
        git clone https://github.com/riscv-software-src/riscv-tests.git "$RUNNER_TEMP/riscv-tests"
        cd "$RUNNER_TEMP/riscv-tests"
        git checkout --detach "$RISCV_TESTS_REVISION"
        git submodule update --init --recursive
        autoconf
        ./configure
        ARCH="${{ matrix.arch }}"
        make -C isa -j$(nproc) RISCV_PREFIX=riscv-none-elf- XLEN="${ARCH#rv}"

    - name: Fetch and build pinned vector tests
      if: matrix.compiler == 'gcc'
      run: |
        git clone https://github.com/chipsalliance/riscv-vector-tests.git "$RUNNER_TEMP/riscv-vector-tests"
        cd "$RUNNER_TEMP/riscv-vector-tests"
        git checkout --detach "$VECTOR_TESTS_REVISION"
        git submodule update --init --recursive
        make -j2

    - name: Show toolchain versions
      run: |
        g++ --version
        riscv-none-elf-gcc --version
        cmake --version
        ninja --version
    
    - name: Configure CMake
      env:
        RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
      shell: bash
      run: |
        if [[ "${{ matrix.compiler }}" == "clang" ]]; then
          CC=clang
          CXX=clang++
        else
          CC=gcc
          CXX=g++
        fi
        VECTOR_ARGS=()
        if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
          VECTOR_ARGS+=("-DSIMRV_VECTOR_TESTS_DIR=${RUNNER_TEMP}/riscv-vector-tests")
        fi
        cmake --preset ${{ matrix.arch }}-release \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DSIMRV_WARNINGS_AS_ERRORS=ON \
          -DSIMRV_ENABLE_SDL=OFF \
          "${VECTOR_ARGS[@]}"

    - name: Build
      run: cmake --build --preset ${{ matrix.arch }}-release

    - name: Run CTest gate suite
      env:
        RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
      run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate

    - name: Record required-suite evidence
      run: >-
        python3 scripts/release_evidence.py
        --build-dir build/${{ matrix.arch }}-release
        --arch ${{ matrix.arch == 'rv32' && '32' || '64' }}
        --compiler ${{ matrix.compiler }}
        --suite native --suite isa
        --dependency riscv_tests=${{ runner.temp }}/riscv-tests
        --output evidence-${{ matrix.compiler }}-${{ matrix.arch }}.json

    - name: Upload evidence
      uses: actions/upload-artifact@v7
      with:
        name: evidence-${{ matrix.compiler }}-${{ matrix.arch }}
        path: evidence-${{ matrix.compiler }}-${{ matrix.arch }}.json

  quality:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install quality tools
      run: dnf install -y cmake ninja-build gcc gcc-c++ libasan libtsan libubsan clang clang-tools-extra python3
    - name: Check release metadata
      run: python3 scripts/release_check.py
    - name: Test release tooling
      run: python3 tests/ReleaseToolTests.py
    - name: Check formatting
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE="${{ github.event.pull_request.base.sha }}"
        else
          BASE="${{ github.event.before }}"
        fi
        mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" -- '*.cpp' '*.hpp')
        if (( ${#FILES[@]} )); then
          clang-format --dry-run --Werror "${FILES[@]}"
        fi
    - name: Configure ASan and UBSan
      run: >-
        cmake -S . -B build/asan -G Ninja
        -DCMAKE_BUILD_TYPE=Debug -DSIMRV_XLEN=64 -DSIMRV_ENABLE_SDL=OFF
        -DSIMRV_WARNINGS_AS_ERRORS=ON -DSIMRV_ENABLE_ASAN=ON -DSIMRV_ENABLE_UBSAN=ON
    - name: Build ASan and UBSan
      run: cmake --build build/asan
    - name: Run sanitizer regressions
      env:
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: ctest --test-dir build/asan --output-on-failure -L regress

  thread-sanitizer:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
    - uses: actions/checkout@v6
    - name: Install build tools
      run: dnf install -y cmake ninja-build gcc gcc-c++ libtsan python3
    - name: Configure TSan
      run: >-
        cmake -S . -B build/tsan -G Ninja
        -DCMAKE_BUILD_TYPE=Debug -DSIMRV_XLEN=64 -DSIMRV_ENABLE_SDL=OFF
        -DSIMRV_ENABLE_TSAN=ON
    - name: Build TSan
      run: cmake --build build/tsan
    - name: Run thread-focused smoke tests
      env:
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      run: ctest --test-dir build/tsan --output-on-failure -R 'tui-framework|cli-|release-metadata'
