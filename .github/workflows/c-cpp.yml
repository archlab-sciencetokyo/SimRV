name: C/C++ CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "22"

    strategy:
      matrix:
        arch: [rv32, rv64]

    steps:
    - uses: actions/checkout@v5

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget lsb-release software-properties-common gnupg
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh "${LLVM_VERSION}"
        sudo apt-get install -y clang-"${LLVM_VERSION}" clang-tidy-"${LLVM_VERSION}" g++-14 cmake ninja-build gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

    - name: Fetch riscv-tests
      run: |
        git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git "$RUNNER_TEMP/riscv-tests"

    - name: Show toolchain versions
      run: |
        clang++-"${LLVM_VERSION}" --version
        cmake --version
        ninja --version
    
    - name: Configure CMake
      run: >-
        cmake --preset ${{ matrix.arch }}-release
        -DCMAKE_C_COMPILER=clang-"${LLVM_VERSION}"
        -DCMAKE_CXX_COMPILER=clang++-"${LLVM_VERSION}"

    - name: Build
      run: cmake --build --preset ${{ matrix.arch }}-release

    - name: Run CTest gate suite
      env:
        RISCV_TESTS_DIR: ${{ runner.temp }}/riscv-tests
      run: ctest --test-dir build/${{ matrix.arch }}-release --output-on-failure -L gate
