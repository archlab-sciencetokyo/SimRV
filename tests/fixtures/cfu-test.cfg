# SimRV CPU Model Configuration: generic CFU test profile
# Generic test profile for custom function units (RV32IM)

[memory]
dram_base = 0x0
dram_size = 512M
bram_prewarm = true

[cpu]
name = "test-cfu"
description = "test-only generic CFU profile"
xlen = 32
isa_preset = "im"

[isa]
extensions = "x-cfu"

[cfu]
enabled = true
opcode = "custom-0"
default_latency = 1
rtl_module = "test_cfu_module"
interface = "rs1-rs2-rd"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 2
div_latency = 34
fp_alu_latency = 3
fp_div_latency = 15
branch_mispredict_penalty = 3
cycle_counter_start_delay = 1
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 2048
bht_entries = 2048
ras_entries = 16
ghr_bits = 10
pc_shift = 2
enable_btb = true
enable_ras = false
untagged_btb = true
predict_non_control = true
jump_uses_direction_counter = true
jump_uses_current_btb = true
registered_btb_read = true
bht_initial_state = 0

[instruction_cache]
capacity_bytes = 32768
associativity = 1
line_bytes = 64
hit_latency = 1
miss_latency = 1

[data_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 64
hit_latency = 1
miss_latency = 1

[interconnect]
request_latency = 1
response_latency = 1
