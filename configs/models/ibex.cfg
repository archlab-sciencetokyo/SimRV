# SimRV CPU Model Configuration: lowRISC Ibex
# Target: lowRISC Ibex 3-stage (WritebackStage) RV32IMC/IMAC embedded core (RV32MFast)

[cpu]
name = "ibex"
description = "lowRISC Ibex 3-stage RV32IMC embedded core"
xlen = 32
isa_preset = "imac"

[pipeline]
type = "three-stage"
enable_forwarding = false
mul_latency = 0
div_latency = 35
fp_alu_latency = 3
fp_div_latency = 15
branch_mispredict_penalty = 2
csr_flush_penalty = 2
fence_flush_penalty = 2

[branch_predictor]
type = "static"
btb_entries = 0
bht_entries = 0
ras_entries = 0
pc_shift = 1
enable_btb = false
enable_ras = false

[instruction_cache]
capacity_bytes = 4096
associativity = 2
line_bytes = 32
hit_latency = 1
miss_latency = 8

[data_cache]
capacity_bytes = 4096
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 2

[interconnect]
request_latency = 1
response_latency = 1
