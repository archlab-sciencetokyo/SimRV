# SimRV CPU Model Configuration: VexRiscv (SpinalHDL)
# Target: SpinalHDL VexRiscv 5-stage RV32IMAC cached core

[cpu]
name = "vexriscv"
description = "SpinalHDL VexRiscv 5-stage RV32IMAC core"
xlen = 32
isa_preset = "imac"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 2
div_latency = 33
fp_alu_latency = 3
fp_div_latency = 15
branch_mispredict_penalty = 3
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 512
bht_entries = 1024
ras_entries = 0
ghr_bits = 8
pc_shift = 2
enable_btb = true
enable_ras = false
untagged_btb = true
predict_non_control = true
bht_initial_state = 1

[instruction_cache]
capacity_bytes = 4096
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 10

[data_cache]
capacity_bytes = 4096
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 10

[interconnect]
request_latency = 1
response_latency = 1
