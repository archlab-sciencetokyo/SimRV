# SimRV CPU Model Configuration: Balanced
# Target: Default balanced 5-stage general-purpose core (RV32GCBV / RV64GCBV)

[cpu]
name = "balanced"
description = "Default balanced 5-stage general-purpose core"
misa = "rv32gcbv"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 3
div_latency = 18
fp_alu_latency = 4
fp_div_latency = 16
branch_mispredict_penalty = 3
cycle_counter_start_delay = 0
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 256
bht_entries = 1024
ras_entries = 16
ghr_bits = 10
pc_shift = 1
enable_btb = true
enable_ras = true
untagged_btb = false
registered_btb_read = false
bht_initial_state = 0

[instruction_cache]
capacity_bytes = 4096
associativity = 2
line_bytes = 32
hit_latency = 1
miss_latency = 10

[data_cache]
capacity_bytes = 4096
associativity = 2
line_bytes = 32
hit_latency = 1
miss_latency = 10

[interconnect]
request_latency = 1
response_latency = 1
