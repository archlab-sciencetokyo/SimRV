# SimRV CPU Model Configuration: CFU-ProvingGround (RVProc)
# Target: Tokyo Tech Archlab CFU-ProvingGround 5-stage FPGA processor (RV32IM)

[soc]
name = "cfu-provingground"
cpu_model = "cfu-provingground"
platform = "baremetal"
device_policy = "explicit"
mmio_console_redirect = true

[memory]
dram_base = 0x0
dram_size = 128M
bram_prewarm = true

[boot]
reset_pc = 0x0
tohost = 0x80001000

[cpu]
name = "cfu-provingground"
description = "Tokyo Tech Archlab CFU-ProvingGround FPGA processor"
xlen = 32
isa_preset = "im"

[isa]
extensions = "x-cfu"

[cfu]
enabled = true
opcode = "custom-0"
default_latency = 1
plugin = "cfu-provingground"
rtl_module = "rvproc_cfu"
interface = "rs1-rs2-rd"

[pipeline]
type = "five-stage"
enable_forwarding = true
bram_prewarm = true
mmio_console_redirect = true
mul_latency = 2
div_latency = 35
fp_alu_latency = 3
fp_div_latency = 15
branch_mispredict_penalty = 3
cycle_counter_start_delay = 2
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 2048
bht_entries = 2048
ras_entries = 16
ghr_bits = 10
pc_shift = 2
enable_btb = true
enable_ras = false
untagged_btb = true
predict_non_control = true
jump_uses_direction_counter = true
jump_uses_current_btb = true
registered_btb_read = true
bht_initial_state = 0

[instruction_cache]
capacity_bytes = 32768
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 1

[data_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 1

[interconnect]
request_latency = 1
response_latency = 1
