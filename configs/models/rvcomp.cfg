[soc]
name = "rvcomp"
cpu_model = "rvcomp"
platform = "baremetal"
device_policy = "explicit"

[memory]
dram_base = 0x80000000
dram_size = 128M

[boot]
reset_pc = 0x80000000
tohost = 0x80001000

[device.uart]
name = "uart0"
base = 0x10000000
size = 0x10
irq = 1

[device.clint]
name = "clint0"
base = 0x02000000
size = 0x000c0000

[device.plic]
name = "plic0"
base = 0x0c000000
size = 0x01000000

[device.reset-control]
name = "reset"
base = 0x10000100
size = 4

[device.ring-buffer-ethernet]
name = "ethernet"
base = 0x14000000
size = 0x4000
irq = 2

[cpu]
name = "rvcomp"
description = "Archlab RVComp 5-stage educational RISC-V processor"
xlen = 32
isa_preset = "ima"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 2
# These values are additional stall cycles after issue; RVComp holds div_stall for 34 cycles.
div_latency = 34
fp_alu_latency = 3
fp_div_latency = 15
branch_mispredict_penalty = 4
cycle_counter_start_delay = 0
host_interface_latency = 21
host_interface_phase_period = 2
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 512
bht_entries = 8192
ras_entries = 16
ghr_bits = 10
pc_shift = 2
enable_btb = true
enable_ras = false
untagged_btb = true
predict_non_control = true
registered_btb_read = false
bht_initial_state = 1

[instruction_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 1

[instruction_front_cache]
capacity_bytes = 1024
associativity = 1
line_bytes = 16
hit_latency = 1
refill_latency = 27
backing_refill_latency = 27
startup_refill_latencies = "40"
freeze_pipeline_on_refill = true

[data_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 32
hit_latency = 4
miss_latency = 1

[interconnect]
request_latency = 1
response_latency = 1
data_request_latency = 30
data_response_latency = 29
startup_data_response_latency = 27

[dma]
enabled = false
setup_latency = 32
bandwidth_bytes_per_cycle = 8
memory_contention_penalty = 2

[axi]
enabled = false
data_width_bytes = 8
id_width_bits = 4
max_outstanding_reads = 8
max_outstanding_writes = 8
burst_length_max = 16
trace_axi = false
