[cpu]
name = "rvcomp"
description = "Archlab RVComp 5-stage educational RISC-V processor"
xlen = 32
misa = "ima"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 2
# SimRV latency includes the issue cycle; RVComp holds div_stall for 34 cycles.
div_latency = 35
fp_alu_latency = 4
fp_div_latency = 16
branch_mispredict_penalty = 4
cycle_counter_start_delay = 0
host_interface_latency = 21
host_interface_phase_period = 2
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 512
bht_entries = 8192
ras_entries = 16
ghr_bits = 10
pc_shift = 2
enable_btb = true
enable_ras = false
untagged_btb = true
predict_non_control = true
registered_btb_read = false
bht_initial_state = 1

[instruction_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 1

[instruction_front_cache]
capacity_bytes = 1024
associativity = 1
line_bytes = 16
hit_latency = 1
refill_latency = 27
backing_refill_latency = 27
startup_refill_latencies = "40"
freeze_pipeline_on_refill = true

[data_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 32
hit_latency = 4
miss_latency = 1

[interconnect]
request_latency = 1
response_latency = 1
data_request_latency = 30
data_response_latency = 29
startup_data_response_latency = 27
