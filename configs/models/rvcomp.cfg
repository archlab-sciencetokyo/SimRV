[cpu]
name = "rvcomp"
description = "Archlab RVComp 5-stage educational RISC-V processor"
xlen = 32
misa = "ima"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 2
div_latency = 34
fp_alu_latency = 4
fp_div_latency = 16
branch_mispredict_penalty = 4
cycle_counter_start_delay = 0
csr_flush_penalty = 3
fence_flush_penalty = 4

[branch_predictor]
type = "bimodal"
btb_entries = 512
bht_entries = 8192
ras_entries = 16
ghr_bits = 10
pc_shift = 2
enable_btb = true
enable_ras = false
untagged_btb = true
registered_btb_read = false
bht_initial_state = 1

[instruction_cache]
capacity_bytes = 1024
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 64

[data_cache]
capacity_bytes = 16384
associativity = 1
line_bytes = 32
hit_latency = 4
miss_latency = 1

[interconnect]
request_latency = 30
response_latency = 30

