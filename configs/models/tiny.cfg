# SimRV CPU Model Configuration: Tiny
# Target: Minimal 3-stage microcontroller profile (RV32IMAC / RV64IMAC)

[cpu]
name = "tiny"
description = "Minimal 3-stage microcontroller core"
misa = "rv32imac"

[pipeline]
type = "three-stage"
enable_forwarding = false
mul_latency = 3
div_latency = 18
fp_alu_latency = 4
fp_div_latency = 16
branch_mispredict_penalty = 2
cycle_counter_start_delay = 0
csr_flush_penalty = 1
fence_flush_penalty = 1

[branch_predictor]
type = "static"
btb_entries = 128
bht_entries = 256
ras_entries = 4
ghr_bits = 0
pc_shift = 1
enable_btb = false
enable_ras = false
untagged_btb = false
registered_btb_read = false
bht_initial_state = 0

[instruction_cache]
capacity_bytes = 2048
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 12

[data_cache]
capacity_bytes = 2048
associativity = 1
line_bytes = 32
hit_latency = 1
miss_latency = 12

[interconnect]
request_latency = 1
response_latency = 1
