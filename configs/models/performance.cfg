# SimRV CPU Model Configuration: Performance
# Target: Aggressive high-throughput 5-stage core (RV32GCBV / RV64GCBV)

[cpu]
name = "performance"
description = "High-throughput 5-stage core with aggressive prediction and caches"
misa = "rv32gcbv"

[pipeline]
type = "five-stage"
enable_forwarding = true
mul_latency = 1
div_latency = 8
fp_alu_latency = 2
fp_div_latency = 8
branch_mispredict_penalty = 2
cycle_counter_start_delay = 0
csr_flush_penalty = 2
fence_flush_penalty = 2

[branch_predictor]
type = "gshare"
btb_entries = 1024
bht_entries = 4096
ras_entries = 32
ghr_bits = 12
pc_shift = 1
enable_btb = true
enable_ras = true
untagged_btb = false
registered_btb_read = false
bht_initial_state = 0

[instruction_cache]
capacity_bytes = 16384
associativity = 4
line_bytes = 32
hit_latency = 1
miss_latency = 8

[data_cache]
capacity_bytes = 16384
associativity = 4
line_bytes = 32
hit_latency = 1
miss_latency = 8

[interconnect]
request_latency = 1
response_latency = 1
